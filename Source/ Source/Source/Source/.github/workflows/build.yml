name: Compilar RoboTune VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar VST3 (Release)
        run: cmake --build build --config Release --target RoboTuneVST_VST3

      - name: Subir archivo VST3 listo
        uses: actions/upload-artifact@v4
        with:
          name: RoboTune-Windows-VST3
          path: build/RoboTuneVST_artefacts/Release/VST3/RoboTune.vst3
